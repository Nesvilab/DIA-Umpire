// To compile and package DIA_Umpire_SE, run ./gradlew clean build in DIA_Umpire_SE. The fat jar is DIA_Umpire_SE/build/libs/DIA_Umpire_SE-<version>.jar.

plugins {
    id 'java-library'
//    id 'idea'
}


group = "umich.nesvilab"
version = '2.3.8'


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            includes = ['ExternalPackages/SortedListLib/',
                        'ExternalPackages/JAligner/',
                        'ExternalPackages/jMEF/',
                        'ExternalPackages/org/',
                        'MSUmpire/']
        }
        resources {
            srcDirs = ['src/']
            excludes = ['*.java', 'test/**'] // src/test holds the JUnit sources
        }
    }
}


dependencies {
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.26.1'

    implementation group: 'commons-io', name: 'commons-io', version: '2.8.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-codec:commons-codec:1.15'

    implementation 'com.vseravno.solna:solna:0.5.1' // for MSUmpire.SearchResultParser.PepXMLParser
    implementation 'de.ruedigermoeller:fst:2.57' // for MSUmpire.SpectrumParser.mzXMLParser
    api 'org.burningwave:core:12.45.1' // must be api

    implementation 'xmlpull:xmlpull:1.1.3.4d_b4_min' // for compomics

    // 1.5.x needs no jcommon (LGPL-2.1): its ui and util classes moved into org.jfree.chart.ui and org.jfree.chart.util
    implementation 'org.jfree:jfreechart:1.5.3'
    implementation('ca.umontreal.iro.simul:ssj:3.3.1') {
        // SSJ reaches colt only through Num.expBesselK1 (cern.jet.math.Bessel), which only NormalInverseGaussianDist
        // calls; DIA-Umpire uses NormalDist, EmpiricalDist and the kernel density classes
        exclude group: 'colt', module: 'colt'
        // SSJ's jfree:jfreechart 1.0.12 (and its jfree:jcommon 1.0.15) serves only umontreal.ssj.charts, which
        // DIA-Umpire does not reach; jfreechart 1.5.3 above provides the org.jfree.chart and org.jfree.data packages
        exclude group: 'jfree', module: 'jfreechart'
        exclude group: 'jfree', module: 'jcommon'
    }

    // implementation 'com.github.chhh:batmass-io:1.38.2'
    compileOnly 'com.github.chhh:batmass-io:1.38.2'
    implementation 'org.apache.commons:commons-math3:3.6.1'

    implementation fileTree(dir: '../libs', include: '*.jar')

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'com.github.chhh:batmass-io:1.38.2' // mzXMLParser refers to batmass-io classes, which FragPipe provides at run time

    implementation 'org.eclipse.collections:eclipse-collections-api:11.0.0'
    implementation 'org.eclipse.collections:eclipse-collections:11.0.0'
}

repositories {
    mavenCentral()
    flatDir { dirs '../lib', '../libs' }
}

task printJarLocations {
    doLast {
        configurations.compileClasspath.each { println it }
    }
}
